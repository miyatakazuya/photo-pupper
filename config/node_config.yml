# Toggle Nodes (1 is activated)
photobooth_nodes:
  fsm_node: 1
  gamepad_node: 1
  movement_node:
    enabled: 1
    parameters:
      real_movement: true
      enable_logging: true
      linear_speed: 0.07
      side_speed: 0.06
      turn_speed: 0.4
      step_seconds: 0.4
      pose_seconds: 0.4
  camera_node:
    enabled: 1
    parameters:
      publishing: false
      turn_threshold: 0.15
      hz: 2.0
  photo_processing_node: 1
  printer_node: 1
  screen_node: 1
  touch_node: 0
  speaker_node:
    enabled: 1
    parameters:
      volume_percent: 50
  pose_controller:
    enabled: 1
    package: mini_pupper_dance
    executable: pose_controller
  joy_node:
    enabled: 1
    package: joy
    executable: joy_node
    parameters:
      device_id: 0
      autorepeat_rate: 20.0
